[package]
name = "teamy-facet-macros"
version = "0.50.0-rc.7"
edition.workspace = true
repository.workspace = true
documentation = "https://docs.rs/teamy-facet-macros"
readme = "README.md"
license.workspace = true
rust-version.workspace = true
description = "TeamDman fork: Derive macro for the Facet trait - proc macro powered by unsynn for compile-time type introspection"
keywords = [
    "reflection",
    "introspection",
    "derive",
    "macro",
    "facet",
]
categories = ["development-tools", "rust-patterns"]
homepage.workspace = true

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
name = "facet_macros"
proc-macro = true

[features]
default = ["helpful-derive"]
function = ["facet-macros-impl/function"]
# Include doc comments in generated Shape/Field/Variant definitions
doc = ["facet-macros-impl/doc"]
# Enable typo suggestions for unknown attributes/fields (uses strsim)
helpful-derive = ["facet-macros-impl/helpful-derive"]

[dependencies]
facet-macros-impl = { package = "teamy-facet-macros-impl", version = "=0.50.0-rc.7", path = "../facet-macros-impl", default-features = false }

# cf. https://hachyderm.io/@epage/114141126315983016
[target.'cfg(any())'.dependencies]

[lints]
workspace = true
