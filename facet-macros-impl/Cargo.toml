[package]
name = "teamy-facet-macros-impl"
version = "0.50.0-rc.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/teamy-facet-macros-impl"
readme = "README.md"
description = "TeamDman fork: Implementation of facet derive macros (parsing and code generation)"
homepage.workspace = true
keywords = [
    "reflection",
    "introspection",
    "serialization",
    "deserialization",
    "derive",
]
categories = ["development-tools", "encoding"]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[features]
default = ["helpful-derive"]
slow-tests = [] # Enable slow tests (compile tests)
ci = ["slow-tests"] # CI feature
function = []
# Include doc comments in generated Shape/Field/Variant definitions
doc = []
# Enable typo suggestions for unknown attributes/fields (uses strsim)
helpful-derive = ["dep:strsim"]

[lib]
name = "facet_macros_impl"

[dependencies]
facet-macro-parse = { package = "teamy-facet-macro-parse", version = "=0.50.0-rc.7", path = "../facet-macro-parse" }
facet-macro-types = { package = "teamy-facet-macro-types", version = "=0.50.0-rc.7", path = "../facet-macro-types" }
proc-macro2 = "1.0.95"
quote = { workspace = true }
strsim = { workspace = true, optional = true }
unsynn = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
