[package]
name = "facet-validate"
publish = false
version = "0.50.0-rc.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Validation attributes for facet - validate field values during deserialization"
keywords = ["validation", "facet", "reflection", "schema"]
categories = ["encoding", "parsing"]
homepage = "https://facet.rs"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
facet-core = { package = "teamy-facet-core", path = "../facet-core", version = "=0.50.0-rc.7" }
facet = { package = "teamy-facet", path = "../facet", version = "=0.50.0-rc.7" }
regex = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
