[package]
name = "teamy-facet-error"
version = "0.50.0-rc.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/teamy-facet-error"
readme = "README.md"
description = "TeamDman fork: thiserror replacement powered by facet - derive Error trait from doc comments"
keywords = ["facet", "error", "derive", "thiserror"]
categories = ["rust-patterns", "development-tools"]

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
name = "facet_error"

[dependencies]
facet = { package = "teamy-facet", path = "../facet", version = "=0.50.0-rc.7" }

[dev-dependencies]
facet = { package = "teamy-facet", path = "../facet" }

[lints]
workspace = true
